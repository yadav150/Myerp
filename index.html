<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="[Your School Name] School Management ERP"
    >

    <meta
        name="author"
        content="Yadav Web Technologies"
    >

    <title>Login | [Your School Name] ERP</title>

    <link rel="stylesheet" href="css/root.css">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/modal.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body class="login-page">

    <main class="login-wrapper">

        <section class="login-card" aria-label="ERP Login">

            <div class="login-brand">

                <div class="login-logo">
                    <img
                        src="assets/images/logo.svg"
                        alt="[Your School Name] Logo"
                    >
                </div>

                <h1>[Your School Name]</h1>

                <p class="login-subtitle">
                    School Management ERP
                </p>

            </div>

            <div
                id="loginMessage"
                class="form-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <form
                id="loginForm"
                class="login-form"
                novalidate
            >

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="username"
                        required
                    >

                    <small
                        class="field-error"
                        id="loginEmailError"
                    ></small>

                </div>

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-field">

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <svg
                                class="icon"
                                id="passwordToggleIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="1.8"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"
                                />
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="loginPasswordError"
                    ></small>

                </div>

                <div class="login-options">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="remember"
                        >

                        <span>Remember me</span>

                    </label>

                    <button
                        type="button"
                        class="text-button"
                        id="forgotPasswordButton"
                    >
                        Forgot Password?
                    </button>

                </div>

                <button
                    type="submit"
                    class="btn btn-primary btn-full"
                    id="loginButton"
                >
                    <span class="button-text">
                        Sign In
                    </span>

                    <span
                        class="button-loader"
                        aria-hidden="true"
                        hidden
                    ></span>
                </button>

            </form>

            <div class="login-footer">

                <p>
                    Authorized access only
                </p>

                <p class="developer-credit">
                    Designed and Developed by
                    <strong>Yadav Web Technologies</strong>
                </p>

            </div>

        </section>

    </main>

    <!-- Forgot Password Modal -->

    <div
        class="modal-overlay"
        id="forgotPasswordModal"
        hidden
        aria-hidden="true"
    >

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="forgotPasswordTitle"
        >

            <div class="modal-header">

                <div>
                    <h2 id="forgotPasswordTitle">
                        Forgot Password
                    </h2>

                    <p>
                        Enter your registered email address.
                    </p>
                </div>

                <button
                    type="button"
                    class="modal-close"
                    id="forgotPasswordClose"
                    aria-label="Close"
                >
                    <svg
                        class="icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                    >
                        <path d="M6 6l12 12"/>
                        <path d="M18 6L6 18"/>
                    </svg>
                </button>

            </div>

            <form
                id="forgotPasswordForm"
                class="modal-body"
                novalidate
            >

                <div class="form-group">

                    <label for="resetEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="resetEmail"
                        name="resetEmail"
                        placeholder="Enter your email address"
                        required
                    >

                    <small
                        class="field-error"
                        id="resetEmailError"
                    ></small>

                </div>

                <div
                    id="resetMessage"
                    class="form-message"
                    role="alert"
                    aria-live="polite"
                    hidden
                ></div>

                <div class="modal-actions">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        id="resetCancelButton"
                    >
                        Cancel
                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary"
                        id="resetPasswordButton"
                    >
                        Send Reset Link
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script src="js/script.js"></script>
    <script src="js/navigation.js"></script>

</body>
</html>
